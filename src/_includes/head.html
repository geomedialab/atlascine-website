<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ site.title[lang] }} | {{ title }}</title>
    {% if description %}
        <meta name="description" content="{{ description }}">
    {% else %}
        <meta name="description" content="{{ site.description[lang] }}">
    {% endif %}
    {% set origin = site.url %}
    {% set isPost = tags and "post" in tags %}
    {% set ogImage = "" %}
    {% if isPost %}{% set ogImage = content | firstImage(origin) %}{% endif %}
    {% if not ogImage %}{% set ogImage = origin + "/imgs/atlascine-logo.png" %}{% endif %}
    <meta property="og:type" content="{% if isPost %}article{% else %}website{% endif %}">
    <meta property="og:site_name" content="{{ site.title[lang] }}">
    <meta property="og:title" content="{{ title }}">
    <meta property="og:description" content="{{ description or site.description[lang] }}">
    <meta property="og:url" content="{{ origin }}{{ page.url }}">
    <meta property="og:image" content="{{ ogImage }}">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="shortcut icon" href="/imgs/atlascine-logo.ico" type="image/x-icon">
    <link rel="stylesheet" type="text/css" href="/css/variables.css" />
    <link rel="stylesheet" type="text/css" href="/css/main.css" />
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400&family=Work+Sans:wght@300&display=swap" rel="stylesheet">

    <script type="text/javascript" src="/js/main.js"></script>
    <script data-goatcounter="https://atlascine-org.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>
